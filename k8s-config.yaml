apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Gi

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: postgres:16-alpine

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: MySuperSecureRootPassword

            - name: POSTGRES_DB
              value: db

          args:
            - postgres
            - -c
            - shared_buffers=64MB
            - -c
            - max_connections=20
            - -c
            - work_mem=2MB

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "300m"

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---

apiVersion: v1
kind: Service

metadata:
  name: postgres

spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: priyanshoe/ollive-backend:latest

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: DATABASE_URL
              value: "postgresql://postgres:MySuperSecureRootPassword@postgres:5432/db"

            - name: GEMINI_API_KEY
              value: ""

            - name: GROQ_API_KEY
              value: ""

            - name: OPENROUTER_API_KEY
              value: ""

            - name: ANALYTICS_ENDPOINT
              value: "http://observability:4000/ingest"

            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"

            limits:
              memory: "2Gi"
              cpu: "1000m"
---

apiVersion: v1
kind: Service

metadata:
  name: backend

spec:
  type: NodePort

  selector:
    app: backend

  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: observability

spec:
  replicas: 1

  selector:
    matchLabels:
      app: observability

  template:
    metadata:
      labels:
        app: observability

    spec:
      containers:
        - name: observability

          image: priyanshoe/ollive-analytics:latest

          ports:
            - containerPort: 4000

          env:
            - name: PORT
              value: "4000"

            - name: DATABASE_URL
              value: "postgresql://postgres:MySuperSecureRootPassword@postgres:5432/db"

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "128Mi"
              cpu: "200m"

---

apiVersion: v1
kind: Service

metadata:
  name: observability

spec:
  type: NodePort

  selector:
    app: observability

  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30040
